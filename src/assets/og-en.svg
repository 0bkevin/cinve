<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Cinve — Ask your assistant about the movies</title>
<desc>Venezuelan cinema listings, showtimes, prices and seats. An illustrative chat shows two available seats together in row C. Free, independent and open source.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d1115"/><stop offset="1" stop-color="#120a0e"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f5eee7} .small{font-size:16px;fill:#b9a9a5} .body{font-size:21px} .muted{fill:#b9a9a5}</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="68" y="97" font-size="44" font-weight="700" letter-spacing="-3">cinve</text><circle cx="177" cy="94" r="4" fill="#ffbd3b"/>
<g font-size="62" font-weight="700" letter-spacing="-2"><text x="68" y="193">Ask your</text><text x="68" y="258">assistant about</text><text x="68" y="323">the</text><text x="173" y="323" style="fill:#ffbd3b">movies.</text></g>
<text x="68" y="383" font-size="24" class="muted">Listings, showtimes, prices, and</text><text x="68" y="416" font-size="24" class="muted">seats at cinemas in Venezuela.</text>
