name: Validación

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: validar (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=22; Vercel runs the current LTS. Test both, so a
        # runtime-specific failure cannot pass on one and hide on the other.
        node: [22, 24]

    services:
      postgres:
        # Pinned by digest (17-alpine, 2026-11-06); update it deliberately.
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cinve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cinve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cinve_test

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run dependency code; they need no Git credentials.
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        # Fails on high or critical advisories in the locked dependency tree.
        run: npm audit --audit-level=high

      - name: Comprobar tipos
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build
