name: Suggest an improvement
description: Suggest a small improvement within Cinve's scope.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. Large proposals should be discussed before starting an implementation.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the issues for similar proposals.
          required: true
        - label: The proposal stays within the scope of querying Venezuelan cinemas.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need isn't covered today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not just the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Is there a smaller solution or an existing flow?
