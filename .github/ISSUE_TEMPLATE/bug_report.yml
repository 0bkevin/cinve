name: Report a bug
description: Report incorrect behavior or a failing query.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cinve. Don't include passwords, cookies, tokens or personal data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the issues and didn't find the same problem.
          required: true
        - label: I removed any credentials or personal data from the report.
          required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Cinepic
        - Cines Unidos
        - Cinex
        - Supercines
        - Gran Cine
        - MCP service or authentication
        - Not applicable / not sure
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: City or venue
      description: Leave empty if not applicable. Don't include account details.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe what you saw and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Include the query, date and minimal steps.
      placeholder: |
        1. I asked…
        2. Cinve answered…
        3. I expected…
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main, 0.1.0 or commit hash

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Attach anonymized information only.
      render: shell
